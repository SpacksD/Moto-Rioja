version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: mototaxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mototaxi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mototaxi-network

  redis:
    image: redis:7-alpine
    container_name: mototaxi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - mototaxi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mototaxi-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mototaxi?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - mototaxi-network
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:

networks:
  mototaxi-network:
    driver: bridge
